<!doctype html>
<html lang="th" class="gh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CNMP Stock</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#121110">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CNMP">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/SpindleMono.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
@font-face{font-family:"Spindle Mono";src:url(fonts/SpindleMono.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Spindle Display";src:url(fonts/SpindleDisplay.woff2) format("woff2");font-display:swap}

/* Layout: one fixed screen per device (phone / iPad / PC). The shell never scrolls; only data lists scroll inside
   their own panels. Brand red (from the CINE MOOD PRODUCT seal) carries the primary numbers and actions;
   sage, sand, dust-blue and rose tiles hold secondary figures. Latin + numbers in Spindle Mono, Thai in Plex Thai Looped. */
:root{
  /* dark-first */
  --bg:#121110; --surface:#1B1918; --surface-2:#252220; --line:#34302D; --fg:#EFEAE4; --muted:#9C938B; --faint:#655D57;
  --brand:#A94D41; --on-brand:#FBF0E9; --accent:#E2806F;
  --sage:#CFD8CB; --sand:#E5D0AA; --dust:#A9BDC5; --rose:#E3B1A3; --on-tile:#1B1715;
  --ok:#8FCB86; --warn:#E8B04E; --bad:#F06A5A;
  --chip-on-bg:#EFEAE4; --chip-on-fg:#1B1715;
  --bar-in:#D06A5B; --bar-out:#4C4642; --grid:#2A2623;
  --scrim:rgba(0,0,0,.55); --shadow:0 18px 60px rgba(0,0,0,.55);
  --f-th:"IBM Plex Sans Thai Looped","Noto Sans Thai Looped","Leelawadee UI","Thonburi",sans-serif;
  --f-display:"Spindle Mono",var(--f-th);
  --f-poster:"Spindle Display","Spindle Mono",var(--f-th);
  --f-body:"Spindle Mono",var(--f-th);
  --r-tile:20px; --r-ctl:999px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#E2E6DE; --surface:#F4F5F1; --surface-2:#E9ECE5; --line:#CBD1C6; --fg:#1C1917; --muted:#625C57; --faint:#9A958F;
    --brand:#94473E; --on-brand:#FBF0E9; --accent:#94473E;
    --sage:#C3CEBD; --sand:#E9D5AE; --dust:#ABC0C8; --rose:#E7B6A8; --on-tile:#1B1715;
    --ok:#2F7D3A; --warn:#9A6400; --bad:#B8352A;
    --chip-on-bg:#1C1917; --chip-on-fg:#F4F5F1;
    --bar-in:#94473E; --bar-out:#B8BEB1; --grid:#D3D8CD;
    --scrim:rgba(28,25,23,.35); --shadow:0 18px 50px rgba(30,28,24,.18);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#E2E6DE; --surface:#F4F5F1; --surface-2:#E9ECE5; --line:#CBD1C6; --fg:#1C1917; --muted:#625C57; --faint:#9A958F;
  --brand:#94473E; --on-brand:#FBF0E9; --accent:#94473E;
  --sage:#C3CEBD; --sand:#E9D5AE; --dust:#ABC0C8; --rose:#E7B6A8; --on-tile:#1B1715;
  --ok:#2F7D3A; --warn:#9A6400; --bad:#B8352A;
  --chip-on-bg:#1C1917; --chip-on-fg:#F4F5F1;
  --bar-in:#94473E; --bar-out:#B8BEB1; --grid:#D3D8CD;
  --scrim:rgba(28,25,23,.35); --shadow:0 18px 50px rgba(30,28,24,.18);
  color-scheme:light;
}

*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:inherit}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.lbl{font-family:var(--f-display);font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);line-height:1.35}
.muted{color:var(--muted)}
[hidden]{display:none!important}
.mark{display:block;width:34px;height:34px;flex:none;background:var(--brand);-webkit-mask:url(icons/mark.png) center/contain no-repeat;mask:url(icons/mark.png) center/contain no-repeat}
.logo-full{width:100%;max-width:180px;aspect-ratio:1;background:var(--brand);-webkit-mask:url(icons/logo-full.png) center/contain no-repeat;mask:url(icons/logo-full.png) center/contain no-repeat}

/* ---------- shell ---------- */
.app{height:100%;display:grid;grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"top" "view" "tabs";margin:0 auto;width:100%;position:relative}
.gh .app{padding-top:env(safe-area-inset-top,0px)}
.rail{grid-area:rail;display:none}
.top{grid-area:top;display:flex;align-items:center;gap:10px;padding-block:10px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.top h1{margin:0;flex:1;min-width:0;font-family:var(--f-display);font-weight:500;font-size:17px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{font-size:12px;color:var(--muted);white-space:nowrap}
#view{grid-area:view;min-height:0;min-width:0;display:flex;flex-direction:column;gap:10px;padding-block:4px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:hidden}
.icon-btn{position:relative;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;padding:0}
.icon-btn svg{width:19px;height:19px}
.badge{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 2px var(--surface)}
.badge.bad{background:var(--bad)}

.tabbar{grid-area:tabs;padding-top:6px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.tabbar-in{display:grid;grid-template-columns:repeat(5,1fr);align-items:center;max-width:520px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:26px;height:62px;padding:0 4px}
.tab{position:relative;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--muted);font-size:12px;line-height:1.3;padding:6px 0}
.tab svg{width:21px;height:21px}
.tab.on{color:var(--fg)}
.rec{justify-self:center;width:54px;height:54px;border-radius:50%;border:0;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;transform:translateY(-12px);box-shadow:0 8px 22px rgba(0,0,0,.3)}
.rec svg{width:26px;height:26px}

/* tablet + PC: left rail */
[data-device="tablet"] .app,[data-device="pc"] .app{grid-template-rows:auto minmax(0,1fr);grid-template-areas:"rail top" "rail view"}
[data-device="tablet"] .app{grid-template-columns:92px minmax(0,1fr)}
[data-device="pc"] .app{grid-template-columns:232px minmax(0,1fr)}
[data-device="tablet"] .tabbar,[data-device="pc"] .tabbar,[data-device="tablet"] .menu-btn,[data-device="pc"] .menu-btn,[data-device="tablet"] .top .mark,[data-device="pc"] .top .mark{display:none}
[data-device="tablet"] .rail,[data-device="pc"] .rail{display:flex;flex-direction:column;gap:2px;min-height:0;overflow:hidden;border-right:1px solid var(--line);padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:10px;padding-top:14px}
.rail .brand{display:flex;align-items:center;gap:10px;padding:0 6px 16px}
.rail .brand b{font-family:var(--f-display);font-weight:400;font-size:13px;letter-spacing:.08em;line-height:1.15}
.rail a{position:relative;display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:14px;color:var(--muted);text-decoration:none;font-size:15px}
.rail a svg{width:20px;height:20px;flex:none}
.rail a.on{background:var(--surface);color:var(--fg)}
.rail a:hover{color:var(--fg)}
.rail a .badge{top:8px;right:auto;left:26px}
.rail .rec-wide{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border:0;border-radius:var(--r-ctl);background:var(--brand);color:var(--on-brand);font-size:15px}
.rail .rec-wide svg{width:20px;height:20px}
[data-device="tablet"] .rail .brand{justify-content:center;padding:0 0 14px}
[data-device="tablet"] .rail .brand b{display:none}
[data-device="tablet"] .rail a{flex-direction:column;gap:2px;padding:8px 2px;font-size:11px;text-align:center;line-height:1.25}
[data-device="tablet"] .rail a .badge{left:auto;right:18px}
[data-device="tablet"] .rail .rec-wide{width:60px;height:60px;border-radius:50%;align-self:center}
[data-device="tablet"] .rail .rec-wide span{display:none}
[data-device="tablet"] .top,[data-device="pc"] .top{padding-block:16px 10px}
[data-device="pc"] .top h1{font-size:19px}
[data-device="tablet"] #view,[data-device="pc"] #view{gap:12px;padding-block:2px 16px;padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
/* a forced device on a larger screen keeps its own proportions */
[data-forced="phone"] .app{max-width:460px;border-left:1px solid var(--line);border-right:1px solid var(--line)}
[data-forced="tablet"] .app{max-width:1180px;border-left:1px solid var(--line);border-right:1px solid var(--line)}

/* ---------- building blocks ---------- */
.scroll{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.tile{border-radius:var(--r-tile);padding:14px 16px;min-width:0;position:relative;display:flex;flex-direction:column;gap:4px;border:0;text-align:left;font:inherit;color:inherit}
button.tile{cursor:pointer}
.t-card{background:var(--surface);border:1px solid var(--line)}
.t-brand{background:var(--brand);color:var(--on-brand)}
.t-sage{background:var(--sage);color:var(--on-tile)}
.t-sand{background:var(--sand);color:var(--on-tile)}
.t-dust{background:var(--dust);color:var(--on-tile)}
.t-rose{background:var(--rose);color:var(--on-tile)}
.tile .lbl{color:inherit;opacity:.75}
.t-card .lbl{color:var(--muted);opacity:1}
.tile .big{font-family:var(--f-display);font-size:26px;line-height:1.05;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .huge{font-family:var(--f-poster);font-size:clamp(40px,11vw,64px);line-height:.95;letter-spacing:-.03em}
.tile .sub{font-size:13px;opacity:.85}
.tile .arrow{position:absolute;right:12px;top:12px;width:30px;height:30px;border-radius:50%;border:1px solid currentColor;display:grid;place-items:center;opacity:.6}
.tile .arrow svg{width:14px;height:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-tile);padding:14px 16px;min-width:0;min-height:0;display:flex;flex-direction:column;gap:10px}
.card.flush{padding:0;gap:0;overflow:hidden}
.card.flush .card-h{padding:12px 16px 10px;border-bottom:1px solid var(--line)}
.card-h{display:flex;align-items:center;gap:10px;flex:none;min-height:30px}
.card-h h2{margin:0;flex:1;min-width:0;font-family:var(--f-display);font-weight:500;font-size:14px;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-ctl);padding:3px;gap:2px;background:var(--bg);flex:none}
.seg button{border:0;background:none;padding:4px 12px;border-radius:var(--r-ctl);font-size:13px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--chip-on-bg);color:var(--chip-on-fg)}
.toolbar{display:flex;gap:8px;align-items:center;flex:none;min-width:0}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:var(--r-ctl);background:var(--surface);border:1px solid var(--line)}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:15px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:none;margin-left:-16px;margin-right:-16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 13px;border-radius:var(--r-ctl);border:1px solid var(--line);background:transparent;font-size:14px;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--chip-on-bg);color:var(--chip-on-fg);border-color:var(--chip-on-bg)}
.chip .n{font-family:var(--f-display);font-size:11px;margin-left:6px;opacity:.7}
.summary{display:flex;flex-wrap:wrap;gap:2px 16px;font-size:14px;color:var(--muted);flex:none}
.summary b{color:var(--fg);font-family:var(--f-display);font-weight:400}
.btn{height:44px;padding:0 18px;border-radius:var(--r-ctl);border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:15px;white-space:nowrap;text-decoration:none;flex:none}
.btn svg{width:18px;height:18px}
.btn.pri{background:var(--brand);color:var(--on-brand);border-color:transparent}
.btn.ghost{background:none}
.btn.danger{color:var(--bad);border-color:var(--bad);background:none}
.btn.danger.arm{background:var(--bad);color:#fff}
.btn.sm{height:36px;padding:0 14px;font-size:14px}
.btn.icon-only{width:44px;padding:0}
[data-device="phone"] .btn .hide-phone{display:none}
.actions{display:flex;gap:8px;flex-wrap:wrap;flex:none}
.actions .grow{flex:1}
.actions.nowrap{flex-wrap:nowrap}
.actions.nowrap .btn{padding:0 12px;min-width:0}

/* lists */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-tile)}
.card .list{border:0;border-radius:0;background:none}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%;min-width:0;color:inherit;text-decoration:none}
.row:first-child,.month-h+.row{border-top:0}
button.row:hover,a.row:hover{background:var(--surface-2)}
.row .ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;font-family:var(--f-display);font-size:12px;color:var(--on-tile)}
.row .ic svg{width:18px;height:18px}
.row .ic.ph{position:relative;overflow:hidden;border-radius:12px;width:44px;height:44px}
.row .ic.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--surface-2)}
img.broken{display:none!important}
.media{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;flex:none}
[data-device="tablet"] .media,[data-device="pc"] .media{grid-template-columns:150px minmax(0,1fr)}
.photo{position:relative;border-radius:16px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line);aspect-ratio:1;display:grid;place-items:center;color:var(--muted);padding:0;width:100%;font:inherit}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo .ph-note{font-size:11px;text-align:center;padding:8px;line-height:1.35;display:flex;flex-direction:column;align-items:center;gap:4px}
.photo .ph-note svg{width:22px;height:22px}
.media .qr-box{height:100%}
.photo-field{display:flex;gap:10px;align-items:center;min-width:0}
.photo-field .photo{width:64px;flex:none;border-radius:12px}
.photo-field .actions{flex:1;min-width:0}
.photo-field .st{color:var(--muted)}
.lens-photo{height:120px;flex:none}
.lens-photo .photo{height:100%;aspect-ratio:auto}
.viewer{flex:1;min-height:0;position:relative;border-radius:16px;overflow:hidden;background:#000}
.viewer img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.row .body{flex:1;min-width:0}
.row .t{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right;flex:none}
.row .r>span{display:block}
.row .q{font-family:var(--f-display);font-size:20px;line-height:1.1}
.row .rs{font-size:12px;color:var(--muted);font-family:var(--f-display)}
.row .c{flex:none;width:96px;text-align:right;font-family:var(--f-display);font-size:14px;color:var(--muted)}
.row .c.w{width:120px}
[data-device="phone"] .row .c,[data-device="phone"] .list-head,.home .row .c,.panel .row .c{display:none}
.list-head{display:flex;gap:12px;padding:8px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.list-head span{font-size:12px;color:var(--muted)}
.list-head .h-body{flex:1;padding-left:50px}
.list-head .c{width:96px;text-align:right;flex:none}
.list-head .c.w{width:120px}
.list-head .h-r{width:84px;text-align:right}
.month-h{display:flex;justify-content:space-between;align-items:baseline;padding:10px 16px 6px;position:sticky;top:0;background:var(--surface);z-index:1;border-top:1px solid var(--line)}
.month-h:first-child{border-top:0}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-weight:500;margin-bottom:2px}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none;display:inline-block}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:var(--r-ctl);font-size:12px;color:var(--on-tile);white-space:nowrap}
.bg-brand{background:var(--brand);color:var(--on-brand)!important}.bg-sage{background:var(--sage)}.bg-sand{background:var(--sand)}.bg-dust{background:var(--dust)}.bg-rose{background:var(--rose)}.bg-mute{background:var(--surface-2);color:var(--muted)!important}

/* ---------- home ---------- */
.home{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.h-hero{flex:none}
.h-hero .split{display:flex;flex-wrap:wrap;gap:4px 20px;margin-top:6px;font-size:13px}
.h-hero .split b{display:block;font-family:var(--f-display);font-weight:400;font-size:16px}
.h-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;flex:none}
.h-stats .tile{padding:12px 14px}
.h-stats .big{font-size:22px}
.h-chart{flex:none;height:178px}
.chart-box{flex:1;min-height:0;position:relative}
.chart-box svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.chart-box text{fill:var(--muted);font-family:var(--f-display);font-size:10px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap;flex:none}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}
.h-list{flex:1;min-height:0}
.h-low{display:none}
@media (max-height:720px){[data-device="phone"] .h-chart{display:none}}
[data-device="tablet"] .home{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);grid-template-areas:"hero list" "stats list" "chart list"}
[data-device="pc"] .home{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);grid-template-areas:"hero list low" "stats list low" "chart list low";gap:12px}
[data-device="tablet"] .h-hero,[data-device="pc"] .h-hero{grid-area:hero}
[data-device="tablet"] .h-stats,[data-device="pc"] .h-stats{grid-area:stats}
[data-device="tablet"] .h-chart,[data-device="pc"] .h-chart{grid-area:chart;height:auto}
[data-device="tablet"] .h-list,[data-device="pc"] .h-list{grid-area:list}
[data-device="pc"] .h-low{grid-area:low;display:flex}
[data-device="pc"] .h-list .seg{display:none}
[data-device="pc"] .h-hero .huge,[data-device="tablet"] .h-hero .huge{font-size:72px}
@media (orientation:portrait){[data-device="tablet"] .home{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto 210px minmax(0,1fr);grid-template-areas:"hero" "stats" "chart" "list"}}
[data-device="pc"] .h-stats .big{font-size:26px}

/* ---------- sheets ---------- */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet .scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .16s ease-out}
.panel{position:relative;width:100%;max-width:620px;max-height:calc(100% - 24px);display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;box-shadow:var(--shadow);padding-top:8px;padding-bottom:max(14px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:up .2s cubic-bezier(.2,.8,.2,1)}
.panel.tall{height:calc(100% - 24px)}
.panel.wide{max-width:860px}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 4px;flex:none}
.panel-h{display:flex;align-items:flex-start;gap:12px;padding-block:6px 10px;flex:none}
.panel-h h3{margin:0;flex:1;font-family:var(--f-display);font-weight:500;font-size:19px;line-height:1.3;letter-spacing:-.01em;min-width:0;overflow-wrap:anywhere}
.panel-h h3 small{display:block;font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--muted);letter-spacing:0;margin-top:1px}
.panel-b{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;overflow:auto;overscroll-behavior:contain}
.panel-f{flex:none;display:flex;flex-direction:column;gap:8px;padding-top:10px}
.panel-b>.list.scroll{min-height:120px}
[data-device="tablet"] .sheet,[data-device="pc"] .sheet{align-items:center;padding:20px}
[data-device="tablet"] .panel,[data-device="pc"] .panel{border-radius:24px;border-bottom:1px solid var(--line);max-height:100%;padding-bottom:16px}
[data-device="tablet"] .panel.tall,[data-device="pc"] .panel.tall{height:min(100%,860px)}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.panel,.sheet .scrim{animation:none}}

/* forms: 4-column grid, fields span 2 by default */
.fgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 10px;flex:none}
.f{display:flex;flex-direction:column;gap:3px;min-width:0;grid-column:span 2}
.f.s1{grid-column:span 1}.f.full{grid-column:1/-1}
.f label{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f label .req{color:var(--accent)}
.in,select.in,textarea.in{width:100%;height:42px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);outline:none;font-size:15px;min-width:0}
select.in{padding-right:4px}
textarea.in{height:auto;min-height:42px;padding:9px 12px;resize:none}
.in:focus{border-color:var(--fg)}
.in.num{font-family:var(--f-display)}
.f .with{display:flex;gap:6px}
.f .with .in{flex:1}
.pick{display:flex;align-items:center;gap:8px;height:42px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left;width:100%;min-width:0}
.pick span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick.empty-v span{color:var(--muted)}
.pick svg{width:16px;height:16px;color:var(--muted);flex:none}
.check{display:flex;align-items:center;gap:8px;height:42px;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--brand);flex:none}
.lines{display:flex;flex-direction:column;gap:8px;flex:1;min-height:96px;overflow:auto}
.line{display:grid;grid-template-columns:minmax(0,1fr) 70px 96px 32px;gap:6px;align-items:end;padding:10px;border-radius:14px;background:var(--surface-2)}
[data-device="phone"] .line{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 32px}
[data-device="phone"] .line .f-item{grid-column:1/-1}
.line .f{grid-column:auto}
.x{width:32px;height:42px;border:0;background:none;color:var(--muted);display:grid;place-items:center;padding:0}
.x svg{width:18px;height:18px}
.total-bar{display:flex;align-items:center;gap:12px}
.total-bar .tot{flex:1;display:flex;align-items:baseline;justify-content:space-between;gap:8px;height:48px;padding:0 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.total-bar .num{font-size:24px}

.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
[data-device="tablet"] .menu,[data-device="pc"] .menu{grid-template-columns:repeat(4,minmax(0,1fr))}
.menu .tile{min-height:92px;justify-content:flex-end;padding:12px 14px}
.menu .tile svg{width:22px;height:22px;position:absolute;top:12px;left:14px}
.menu .tile b{font-weight:600;font-size:15px;line-height:1.3}
.menu .tile span{font-size:12px;opacity:.75;line-height:1.3}

.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden;flex:none}
.kv.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kv>div{background:var(--surface);padding:8px 12px;min-width:0}
.kv b{display:block;font-family:var(--f-display);font-weight:400;font-size:16px;overflow-wrap:anywhere;line-height:1.3}
.kv .full{grid-column:1/-1}
.kv span.lbl{display:block;font-size:11px}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;flex:none}
.trio .tile{padding:10px 12px}
.trio .big{font-size:20px}
.qr-box{display:flex;gap:12px;align-items:center;padding:10px;border-radius:16px;background:#fff;color:#111;min-width:0}
.qr-box .qr{width:84px;height:84px;flex:none}
.qr-box .qr svg{width:100%;height:100%;display:block}
.qr-box .num{font-size:16px;overflow-wrap:anywhere}
.qr-box .lbl{color:#666}
.contacts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;flex:none}
.contact{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);min-width:0;min-height:42px}
.contact.full{grid-column:1/-1}
.contact .lbl{flex:none;font-size:11px}
.contact span.v{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.contact button{width:30px;height:30px;border:0;background:none;color:var(--muted);display:grid;place-items:center;flex:none;padding:0}
.contact button svg{width:16px;height:16px}
.lensfig{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px 10px;flex:none}
.lensfig svg{width:100%;height:96px;display:block}
.lensfig text{font-family:var(--f-display);font-size:9px;fill:var(--muted)}
.banner{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:14px;background:var(--sand);color:var(--on-tile);font-size:14px;line-height:1.4;flex:none}
.banner button{margin-left:auto;border:1px solid currentColor;background:none;border-radius:var(--r-ctl);height:32px;padding:0 12px;font-size:13px;white-space:nowrap}
#qr-reader{width:100%;border-radius:16px;overflow:hidden;background:#000;min-height:200px;flex:none}
#qr-reader video{width:100%!important;height:auto!important;display:block}

/* settings */
.setup{display:grid;grid-template-columns:1fr;gap:10px;align-content:start;flex:1;min-height:0;overflow:auto}
[data-device="tablet"] .setup,[data-device="pc"] .setup{grid-template-columns:repeat(2,minmax(0,1fr))}
[data-device="pc"] .setup{grid-template-columns:repeat(3,minmax(0,1fr))}
.setup .card{gap:10px}
.opt-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.opt-row>span{font-size:14px}
.status{display:flex;align-items:center;gap:8px;font-size:14px}
.about{display:flex;gap:14px;align-items:center}
.about .logo-full{width:96px;flex:none}

/* labels */
.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;align-content:start}
.label{background:#fff;color:#111;border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;break-inside:avoid}
.label .qr{width:100px;height:100px}
.label .qr svg{width:100%;height:100%}
.label b{font-family:var(--f-display);font-weight:400;font-size:12px}
.label span{font-size:11px;line-height:1.3}
@media print{
  html,body{overflow:visible;height:auto;background:#fff}
  .app{display:block;height:auto}.rail,.tabbar,.top,.no-print{display:none!important}
  #view{overflow:visible;padding:0}.scroll{overflow:visible}.label{border:1px solid #ccc}
}

#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--fg);color:var(--bg);padding:9px 18px;border-radius:var(--r-ctl);font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
[data-device="tablet"] #toast,[data-device="pc"] #toast{bottom:28px}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="rail" id="rail"></aside>
  <header class="top" id="top"></header>
  <main id="view"></main>
  <nav class="tabbar" id="tabbar"></nav>
</div>
<div id="sheets"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const T0 = performance.now();
/* ============ utils ============ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { const n = parseFloat(String(v ?? '').replace(/,/g, '')); return isFinite(n) ? n : 0; };
const fmt = (n, d = 0) => (Number(n) || 0).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const baht = n => (n < 0 ? '−' : '') + '฿' + fmt(Math.abs(n));
const fmtQ = n => { n = Number(n) || 0; return Number.isInteger(n) ? fmt(n) : fmt(n, 2); };
const trimNum = n => String(+(+n).toFixed(3));
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { } }
};
const pad = n => String(n).padStart(2, '0');
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const nowISO = () => new Date().toISOString();
const MON = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
const MON_TH = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
const dshort = s => { if (!s) return ''; const [y, m, d] = String(s).slice(0, 10).split('-'); return `${+d} ${MON_TH[+m - 1] || ''} ${String(y).slice(2)}`; };
const rid = p => { const d = new Date(); return `${p}-${String(d.getFullYear()).slice(2)}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${Math.random().toString(36).slice(2, 6).toUpperCase()}`; };
const ymKey = s => String(s || '').slice(0, 7);
const debounce = (f, ms = 140) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => f(...a), ms); }; };

/* ============ images (Google Drive) ============ */
const IS_GH = document.documentElement.classList.contains('gh');
const driveId = u => { u = String(u || ''); const m = u.match(/(?:\/d\/|[?&]id=)([-\w]{20,})/) || u.match(/^([-\w]{25,})$/); return m ? m[1] : ''; };
function imgSrc(u, w = 200) {
  u = String(u || ''); if (!u) return '';
  if (u.startsWith('data:image')) return u;
  const id = driveId(u); if (id) return `https://lh3.googleusercontent.com/d/${id}=w${w}`;
  return /^https?:\/\//.test(u) ? u : '';
}
const imgTag = (u, w) => { const s = imgSrc(u, w); return s ? `<img src="${esc(s)}" alt="" loading="lazy" decoding="async">` : ''; };
// lh3 first (fast CDN); if it fails, try Drive's thumbnail endpoint once, then fall back to the icon/placeholder
document.addEventListener('error', e => {
  const t = e.target; if (!t || t.tagName !== 'IMG') return;
  const id = driveId(t.src.replace('lh3.googleusercontent.com/d/', 'x/d/'));
  if (!t.dataset.fb && id && t.src.includes('lh3.googleusercontent.com')) { t.dataset.fb = '1'; const w = (t.src.match(/=w(\d+)/) || [0, 400])[1]; t.src = `https://drive.google.com/thumbnail?id=${id}&sz=w${w}`; return; }
  t.classList.add('broken');
}, true);
function resizeImage(file, max, q = .82) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', q));
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('อ่านรูปไม่ได้')); };
    im.src = url;
  });
}
async function uploadImage(dataUrl, name) {
  const res = await fetch(S.cfg.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ key: S.cfg.key, upload: { name, mime: 'image/jpeg', data: dataUrl.split(',')[1] } }) });
  const js = await res.json(); if (!js.ok) throw new Error(js.error || 'upload failed'); return js.url;
}
function photoBox(u, w, emptyText, attrs = '') {
  const has = !!imgSrc(u, w);
  const note = has ? (IS_GH || String(u).startsWith('data:') ? '' : `${ic('box')}รูปจาก Google Drive<br>แสดงในแอปบน GitHub`) : `${ic('plus')}${emptyText}`;
  return `<button class="photo" type="button" ${attrs}><span class="ph-note">${note}</span>${imgTag(u, w)}</button>`;
}
function openViewer(u, title) {
  const id = driveId(u);
  openSheet(`${head(esc(title), id ? `<a href="https://drive.google.com/file/d/${id}/view" target="_blank" rel="noopener">เปิดใน Google Drive ›</a>` : '')}<div class="viewer">${imgTag(u, 1600)}</div>`, { cls: 'tall' });
}

/* ============ icons ============ */
const ICON = {
  home: '<path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/>',
  box: '<path d="M3.5 7.5 12 3l8.5 4.5v9L12 21l-8.5-4.5z"/><path d="M3.5 7.5 12 12l8.5-4.5M12 12v9"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  user: '<circle cx="12" cy="8.5" r="3.6"/><path d="M4.5 20c1.2-3.6 4.1-5.4 7.5-5.4s6.3 1.8 7.5 5.4"/>',
  lens: '<circle cx="12" cy="12" r="8.5"/><path d="M12 3.5 15.5 12M20.5 12 12 15.5M12 20.5 8.5 12M3.5 12 12 8.5"/>',
  list: '<path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r=".8"/><circle cx="4" cy="12" r=".8"/><circle cx="4" cy="18" r=".8"/>',
  wrench: '<path d="M14.5 6.5a4 4 0 0 0 5 5l-8.8 8.8a2.1 2.1 0 0 1-3-3L16.5 8.5a4 4 0 0 1-2-2z"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/>',
  search: '<circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5"/>',
  scan: '<path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16M4 12h16"/>',
  menu: '<path d="M4 7h16M4 12h16M4 17h16"/>',
  close: '<path d="M6 6l12 12M18 6 6 18"/>',
  arrow: '<path d="M7 17 17 7M9 7h8v8"/>',
  chev: '<path d="m9 6 6 6-6 6"/>',
  down: '<path d="m6 9 6 6 6-6"/>',
  cart: '<path d="M4 5h2l2.2 10.5h10L20 8H7"/><circle cx="9.5" cy="19" r="1.3"/><circle cx="17" cy="19" r="1.3"/>',
  in: '<path d="M12 4v11M7 10l5 5 5-5"/><path d="M4 19.5h16"/>',
  adjust: '<path d="M5 6h9M18 6h1M5 12h3M12 12h7M5 18h11M20 18h-1"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
  tag: '<path d="M3.5 12.5V4.5a1 1 0 0 1 1-1h8l8 8-9 9z"/><circle cx="8" cy="8" r="1.4"/>',
  qr: '<rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><path d="M14 14h2v2h-2zM18 18h2v2h-2zM14 18h2M18 14h2"/>',
  sync: '<path d="M4 12a8 8 0 0 1 14-5.3L20 9M20 4v5h-5M20 12a8 8 0 0 1-14 5.3L4 15M4 20v-5h5"/>',
  copy: '<rect x="8" y="8" width="11" height="11" rx="2"/><path d="M5 15V6a1 1 0 0 1 1-1h9"/>',
  trash: '<path d="M5 7h14M10 7V4.5h4V7M7 7l1 13h8l1-13"/>',
  edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/>'
};
const ic = (n, extra = '') => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra}>${ICON[n] || ''}</svg>`;

/* ============ dictionaries ============ */
const CAT = { PRODUCT: 'สินค้าผลิต', ACCESSORY: 'อุปกรณ์เสริม', LENS: 'เลนส์', MATERIAL: 'วัตถุดิบ', EQUIPMENT: 'เครื่องมือ', LABOR: 'ค่าแรง', RND: 'R&D', OTHER: 'อื่นๆ', ADJUST: 'ยกยอด' };
const CAT_COLOR = { PRODUCT: 'brand', ACCESSORY: 'dust', LENS: 'rose', MATERIAL: 'sand', EQUIPMENT: 'mute', LABOR: 'mute', RND: 'sage', OTHER: 'mute', ADJUST: 'mute' };
const PAY = { PAID: 'จ่ายแล้ว', PARTIAL: 'จ่ายบางส่วน', UNPAID: 'ค้างจ่าย' };
const SST = { PENDING: 'รอส่ง', SHIPPED: 'ส่งแล้ว', DELIVERED: 'ได้รับแล้ว', CANCELLED: 'ยกเลิก' };
const JST = { RECEIVED: 'รับงาน', IN_PROGRESS: 'กำลังทำ', DONE: 'เสร็จ', DELIVERED: 'ส่งคืนแล้ว', CANCELLED: 'ยกเลิก' };
const JST_COLOR = { RECEIVED: 'sand', IN_PROGRESS: 'dust', DONE: 'sage', DELIVERED: 'mute', CANCELLED: 'rose' };
const ADJ = { OPENING: 'ยอดยกมา', COUNT: 'ตรวจนับ', DAMAGED: 'เสียหาย', LOST: 'สูญหาย', USED_INTERNAL: 'ใช้เอง', OTHER: 'อื่นๆ' };
const UNIT = { pcs: 'ชิ้น', set: 'ชุด', lens: 'ตัว', roll: 'ม้วน', bottle: 'ขวด', unit: 'เครื่อง', machine: 'เครื่อง', job: 'ครั้ง', THB: 'บาท' };
const DEFAULT_LISTS = {
  category: Object.keys(CAT), unit: Object.keys(UNIT),
  channel: ['Walk-in', 'Facebook', 'Instagram', 'LINE', 'eBay', 'Website', 'Shopee', 'Other'],
  payment: Object.keys(PAY), sale_status: Object.keys(SST), job_status: Object.keys(JST),
  service: ['Lens MOD', 'Rehousing', 'Gear ring', 'Repair / CLA', 'Custom part', 'Other'],
  mount: ['Canon FD', 'Nikon F', 'C/Y', 'Leica R', 'Leica M', 'M42', 'OM', 'Minolta SR', 'Konica AR', 'MFT', 'PL', 'EF', 'E', 'Other'],
  adj_reason: Object.keys(ADJ)
};
const ID = { ITEMS: 'item_code', PURCHASES: 'purchase_id', SALES: 'sale_id', ADJUST: 'adj_id', CUSTOMERS: 'customer_id', JOBS: 'job_id', LENSES: 'lens_id' };
const NUMF = new Set(['cost', 'price', 'min_stock', 'qty', 'unit_cost', 'other_cost', 'total', 'unit_price', 'discount', 'qty_change', 'paid', 'focus_dia', 'focus_w', 'zoom_dia', 'zoom_w', 'iris_dia', 'iris_w', 'move_len', 'simmod_dia', 'service_price', 'sort']);
const BOOLF = new Set(['track_stock', 'active', 'special_file']);
const STRF = new Set(['item_code', 'lens_id', 'customer_id', 'legacy_id', 'focal', 'aperture', 'phone', 'order_no']);

/* ============ state ============ */
const emptyDB = () => ({ ITEMS: [], PURCHASES: [], SALES: [], ADJUST: [], CUSTOMERS: [], JOBS: [], LENSES: [], LISTS: [] });
const S = {
  db: emptyDB(), calc: {}, mode: 'local', sync: 'idle', lastPull: ls.get('cnmp.lastPull', 0), device: 'phone',

  ui: Object.assign({ stockCat: 'ALL', stockQ: '', lensQ: '', lensBrand: 'ALL', custQ: '', ledger: 'SALES', ledgerQ: '', jobSt: 'OPEN', homeList: 'recent', year: new Date().getFullYear() }, ls.get('cnmp.ui', {}))
};
const saveUI = () => ls.set('cnmp.ui', { stockCat: S.ui.stockCat, lensBrand: S.ui.lensBrand, ledger: S.ui.ledger, jobSt: S.ui.jobSt, homeList: S.ui.homeList });
const saveCfg = () => ls.set('cnmp.cfg', S.cfg);

function normalize(src) {
  const db = emptyDB();
  for (const k of Object.keys(db)) {
    db[k] = (src && Array.isArray(src[k]) ? src[k] : []).map(r => {
      const o = {};
      for (const f in r) {
        const v = r[f];
        if (NUMF.has(f)) o[f] = v === '' || v == null ? '' : num(v);
        else if (BOOLF.has(f)) o[f] = v === true || v === 'TRUE' || v === 'true' || v === 1 || v === '1';
        else o[f] = v == null ? '' : (STRF.has(f) ? String(v) : v);
      }
      return o;
    }).filter(r => k === 'LISTS' || String(r[ID[k]] ?? '') !== '');
  }
  return db;
}
function lists(name) {
  const l = S.db.LISTS.filter(r => r.list === name).sort((a, b) => a.sort - b.sort).map(r => String(r.value));
  return l.length ? l : (DEFAULT_LISTS[name] || []);
}
function derive() {
  const d = S.db, stock = {}, soldQ = {}, item = {}, cust = {}, lens = {};
  for (const i of d.ITEMS) { stock[i.item_code] = 0; item[i.item_code] = i; }
  for (const c of d.CUSTOMERS) cust[c.customer_id] = c;
  for (const l of d.LENSES) lens[l.lens_id] = l;
  for (const p of d.PURCHASES) stock[p.item_code] = (stock[p.item_code] || 0) + num(p.qty);
  for (const s of d.SALES) { if (s.status === 'CANCELLED') continue; stock[s.item_code] = (stock[s.item_code] || 0) - num(s.qty); soldQ[s.item_code] = (soldQ[s.item_code] || 0) + num(s.qty); }
  for (const a of d.ADJUST) stock[a.item_code] = (stock[a.item_code] || 0) + num(a.qty_change);
  let value = 0; const low = [];
  for (const i of d.ITEMS) {
    if (!i.track_stock || i.active === false) continue;
    const q = stock[i.item_code] || 0;
    if (q > 0) value += q * num(i.cost);
    if (q <= num(i.min_stock)) low.push(i);
  }
  low.sort((a, b) => (stock[a.item_code] || 0) - (stock[b.item_code] || 0));
  S.calc = { stock, soldQ, item, cust, lens, value, low };
}
const isAdjustItem = code => (S.calc.item[code] || {}).category === 'ADJUST';
function stockState(i) {
  if (!i.track_stock) return { k: 'none', t: 'ไม่นับสต๊อก', c: '' };
  const q = S.calc.stock[i.item_code] || 0;
  if (q <= 0) return { k: 'bad', t: 'หมด', c: 'bad' };
  if (q <= num(i.min_stock)) return { k: 'warn', t: 'ใกล้หมด', c: 'warn' };
  return { k: 'ok', t: 'พร้อมขาย', c: 'ok' };
}
function finance(year) {
  const m = Array.from({ length: 12 }, () => ({ inc: 0, out: 0 })), y = String(year);
  const add = (date, k, v) => { if (String(date).slice(0, 4) !== y) return; const i = +String(date).slice(5, 7) - 1; if (m[i]) m[i][k] += v; };
  for (const s of S.db.SALES) if (s.status !== 'CANCELLED' && !isAdjustItem(s.item_code)) add(s.date, 'inc', num(s.total));
  for (const j of S.db.JOBS) if (j.status !== 'CANCELLED') add(j.date, 'inc', num(j.paid));
  for (const p of S.db.PURCHASES) if (!isAdjustItem(p.item_code)) add(p.date, 'out', num(p.total));
  return m;
}
function years() {
  const ys = new Set([new Date().getFullYear()]);
  for (const r of [...S.db.SALES, ...S.db.PURCHASES, ...S.db.JOBS]) { const y = +String(r.date).slice(0, 4); if (y > 2000) ys.add(y); }
  return [...ys].sort();
}

/* ============ buffer: local-first data + background sync ============ */
let persistT = null;
function persist() {
  clearTimeout(persistT);
  ls.set('cnmp.queue', S.queue);
  persistT = setTimeout(() => { ls.set(S.mode === 'demo' ? 'cnmp.demo' : 'cnmp.cache', S.db); }, 30);
}
function applyOp(db, op) {
  const arr = db[op.sheet]; if (!arr) return;
  const key = ID[op.sheet];
  const i = arr.findIndex(r => String(r[key]) === String(op.id));
  if (op.action === 'delete') { if (i >= 0) arr.splice(i, 1); return; }
  if (i >= 0) arr[i] = Object.assign({}, arr[i], op.row); else arr.push(Object.assign({}, op.row));
}
function commit(ops, msg) {
  for (const op of ops) { op.opId = op.opId || rid('OP'); applyOp(S.db, op); }
  if (S.mode === 'live') S.queue.push(...ops);
  derive(); persist(); render();
  if (msg) toast(msg);
  if (S.mode === 'live') flush();
}
const up = (sheet, row) => ({ sheet, action: 'upsert', id: row[ID[sheet]], row });
const del = (sheet, id) => ({ sheet, action: 'delete', id, row: {} });

let pulling = false;
async function pull(silent) {
  if (!S.cfg.url || pulling) return;
  pulling = true; S.sync = 'pulling'; renderBadge();
  try {
    const u = S.cfg.url + (S.cfg.url.includes('?') ? '&' : '?') + 'action=all&key=' + encodeURIComponent(S.cfg.key);
    const res = await fetch(u, { method: 'GET', redirect: 'follow', cache: 'no-store' });
    const js = await res.json();
    if (!js.ok) throw new Error(js.error || 'error');
    const db = normalize(js.data);
    for (const op of S.queue) applyOp(db, op);
    S.db = db; S.lastPull = Date.now(); ls.set('cnmp.lastPull', S.lastPull);
    S.sync = S.queue.length ? 'pending' : 'ok';
    derive(); persist(); render(true);
    if (!silent) toast('ดึงข้อมูลล่าสุดแล้ว');
  } catch (e) {
    S.sync = 'offline'; renderBadge();
    if (!silent) toast('เชื่อมต่อ Google Sheet ไม่ได้ ใช้ข้อมูลในเครื่องไปก่อน');
  }
  pulling = false;
}
let flushing = false, retryT = null;
async function flush() {
  if (S.mode !== 'live' || flushing || !S.queue.length) { renderBadge(); return; }
  flushing = true; S.sync = 'pushing'; renderBadge();
  try {
    const batch = S.queue.slice(0, 40);
    const res = await fetch(S.cfg.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ key: S.cfg.key, ops: batch }) });
    const js = await res.json();
    if (!js.ok) throw new Error(js.error);
    const done = new Set(js.results.filter(r => r.ok).map(r => r.op));
    S.queue = S.queue.filter(op => !done.has(op.opId));
    S.sync = S.queue.length ? 'pending' : 'ok';
    ls.set('cnmp.queue', S.queue);
    flushing = false; renderBadge();
    if (S.queue.length && done.size) return flush();
    return;
  } catch (e) {
    S.sync = 'offline';
    clearTimeout(retryT); retryT = setTimeout(flush, 15000);
  }
  flushing = false; renderBadge();
}
window.addEventListener('online', () => { flush(); pull(true); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && S.mode === 'live') { flush(); if (Date.now() - S.lastPull > 60000) pull(true); }
});

const mqDark = matchMedia('(prefers-color-scheme: dark)');
function applyTheme() {
  const t = S.cfg.theme;
  if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  else document.documentElement.removeAttribute('data-theme');
  const dark = t === 'dark' || (t === 'system' && mqDark.matches);
  const meta = $('meta[name="theme-color"]'); if (meta) meta.content = dark ? '#121110' : '#E2E6DE';
}
mqDark.addEventListener?.('change', applyTheme);
function detectDevice() {
  const w = innerWidth, h = innerHeight, coarse = matchMedia('(pointer:coarse)').matches;
  if (w < 640 || (coarse && Math.min(w, h) < 500)) return 'phone';
  if (coarse || w < 1100) return 'tablet';
  return 'pc';
}
function applyDevice() {
  const auto = detectDevice();
  const dev = S.cfg.device === 'auto' ? auto : S.cfg.device;
  const changed = dev !== S.device;
  S.device = dev; S.autoDevice = auto;
  const html = document.documentElement;
  html.dataset.device = dev;
  if (S.cfg.device !== 'auto' && S.cfg.device !== auto) html.dataset.forced = dev; else delete html.dataset.forced;
  return changed;
}

function drawChart() {
  const box = $('#chartBox'); if (!box || !box.clientWidth || !box.clientHeight) return;
  const m = finance(S.ui.year), now = new Date(), curIdx = S.ui.year === now.getFullYear() ? now.getMonth() : -1;
  const W = box.clientWidth, H = box.clientHeight, L = 34, R = 2, T = 6, B = 18;
  const max = Math.max(1, ...m.map(x => Math.max(x.inc, x.out)));
  const step = niceStep(max / (H > 150 ? 4 : 2)), top = Math.ceil(max / step) * step;
  const sy = v => T + (H - T - B) * (1 - v / top);
  const gw = (W - L - R) / 12, bw = Math.max(3, Math.min(14, gw / 2.8));
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="กราฟรายรับรายจ่ายรายเดือน">`;
  for (let v = 0; v <= top + 1e-9; v += step) {
    s += `<line x1="${L}" x2="${W - R}" y1="${sy(v)}" y2="${sy(v)}" stroke="var(--grid)"/>`;
    s += `<text x="${L - 6}" y="${sy(v) + 3}" text-anchor="end">${v >= 1000 ? trimNum(v / 1000) + 'k' : fmt(v)}</text>`;
  }
  m.forEach((x, i) => {
    const cx = L + gw * i + gw / 2;
    s += `<rect x="${cx - bw - 1}" y="${sy(x.inc)}" width="${bw}" height="${Math.max(0, sy(0) - sy(x.inc))}" rx="2" fill="var(--bar-in)"><title>${MON[i]} รายรับ ${baht(x.inc)}</title></rect>`;
    s += `<rect x="${cx + 1}" y="${sy(x.out)}" width="${bw}" height="${Math.max(0, sy(0) - sy(x.out))}" rx="2" fill="var(--bar-out)"><title>${MON[i]} รายจ่าย ${baht(x.out)}</title></rect>`;
    s += `<text x="${cx}" y="${H - 4}" text-anchor="middle" ${i === curIdx ? 'style="fill:var(--fg)"' : ''}>${gw < 30 ? MON[i][0] : MON[i]}</text>`;
  });
  box.innerHTML = s + '</svg>';
}
function niceStep(x) { const p = Math.pow(10, Math.floor(Math.log10(x || 1))); const f = x / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }

function custStats(id) {
  const sales = S.db.SALES.filter(s => s.customer_id === id && s.status !== 'CANCELLED');
  const jobs = S.db.JOBS.filter(j => j.customer_id === id && j.status !== 'CANCELLED');
  const orders = new Set(sales.map(s => s.order_no || s.sale_id)).size;
  const spend = sales.reduce((a, s) => a + num(s.total), 0) + jobs.reduce((a, j) => a + num(j.paid), 0);
  const last = [...sales, ...jobs].map(r => r.date).sort().pop() || '';
  return { sales, jobs, orders, spend, last };
}

/* ============ QR (lazy) ============ */
const loaded = {};
function loadScript(src) {
  return loaded[src] || (loaded[src] = new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.async = true; s.onload = res; s.onerror = () => { delete loaded[src]; rej(); }; document.head.appendChild(s); }));
}
const QR_LIB = 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js';
function qrSVG(text) {
  const q = qrcode(0, 'M'); q.addData(String(text)); q.make();
  const n = q.getModuleCount(); let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c} ${r}h1v1h-1z`;
  return `<svg viewBox="-2 -2 ${n + 4} ${n + 4}" shape-rendering="crispEdges" role="img" aria-label="QR ${esc(text)}"><rect x="-2" y="-2" width="${n + 4}" height="${n + 4}" fill="#fff"/><path d="${d}" fill="#111"/></svg>`;
}
function fillQR(root) {
  if (!root) return;
  const go = () => root.querySelectorAll('[data-qr]').forEach(el => { if (!el.firstChild) el.innerHTML = qrSVG(el.dataset.qr); });
  if (typeof qrcode === 'function') go(); else loadScript(QR_LIB).then(go).catch(() => { });
}
let scanner = null;
function openScanner(onCode, title = 'สแกน QR / บาร์โค้ด') {
  const sh = openSheet(`${head(title, 'เล็งกล้องไปที่ฉลาก หรือพิมพ์รหัสเอง')}
    <div class="panel-b"><div id="qr-reader"></div><p class="muted" id="qrMsg" style="margin:0;font-size:13px">กำลังเปิดกล้อง…</p></div>
    <form id="manualCode" class="panel-f" style="flex-direction:row"><input class="in num" name="code" placeholder="พิมพ์รหัสสินค้า" autocomplete="off"><button class="btn pri" type="submit">ตกลง</button></form>`, {
    onClose: () => { if (scanner) { const s = scanner; scanner = null; s.stop().catch(() => { }).finally(() => { try { s.clear(); } catch (e) { } }); } }
  });
  const done = code => { code = String(code).trim(); if (!code) return; closeSheet(sh); setTimeout(() => onCode(code), 60); };
  $('#manualCode', sh).addEventListener('submit', e => { e.preventDefault(); done(new FormData(e.target).get('code')); });
  loadScript('https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js').then(() => {
    if (!document.body.contains(sh)) return;
    scanner = new Html5Qrcode('qr-reader');
    return scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 220, height: 220 } }, txt => done(txt), () => { })
      .then(() => { const m = $('#qrMsg', sh); if (m) m.textContent = 'พร้อมสแกน'; });
  }).catch(() => { const m = $('#qrMsg', sh); if (m) m.textContent = 'เปิดกล้องไม่ได้ (ต้องอนุญาตกล้องและเปิดผ่าน https) พิมพ์รหัสด้านล่างแทนได้'; const r = $('#qr-reader', sh); if (r) r.hidden = true; });
}
function scanToItem() { openScanner(code => { if (S.calc.item[code]) openItem(code); else formItem({ item_code: code }, true); }); }

/* ============ sheets ============ */
const stack = [];
function openSheet(html, opt = {}) {
  const el = document.createElement('div');
  el.className = 'sheet'; el.style.zIndex = 20 + stack.length * 2;
  el.innerHTML = `<div class="scrim" data-close></div><div class="panel ${opt.cls || ''}" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
  el._opt = opt;
  $('#sheets').appendChild(el); stack.push(el);
  el.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeSheet(el); });
  if (S.device !== 'phone') setTimeout(() => { const f = el.querySelector('[autofocus]'); if (f) f.focus(); }, 40);
  return el;
}
function closeSheet(el) {
  el = el || stack[stack.length - 1]; if (!el) return;
  const i = stack.indexOf(el); if (i >= 0) stack.splice(i, 1);
  el._opt.onClose && el._opt.onClose();
  el.remove();
}
function closeAll() { while (stack.length) closeSheet(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && stack.length) closeSheet(); });
const head = (t, sub) => `<div class="panel-h"><h3>${t}${sub ? `<small>${sub}</small>` : ''}</h3><button class="icon-btn" type="button" data-close aria-label="ปิด">${ic('close')}</button></div>`;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2200); }

    ${allowNone ? `<div class="actions" style="margin-top:8px"><button class="btn sm ghost" type="button" data-pk-none>${allowNone}</button></div>` : ''}
    <div class="list scroll" id="pkList" style="margin-top:10px"></div>`, { cls: 'tall' });
  const draw = q => {

function fieldHTML(f, v) {

  if (f.type === 'select') return `<div class="${cls}"><label for="${id}">${f.l}${req}</label><select class="in" id="${id}" name="${f.k}">${(f.opts || []).map(o => { const [val, lab] = Array.isArray(o) ? o : [o, (f.labels || {})[o] || o]; return `<option value="${esc(val)}" ${String(v) === String(val) ? 'selected' : ''}>${esc(lab)}</option>`; }).join('')}</select></div>`;
  if (f.type === 'photo') return `<div class="${cls}"><label>${f.l}</label><div class="photo-field" data-photo="${f.k}">${photoBox(v, 200, '', 'data-pf-pick tabindex="-1"')}
    <div class="actions"><label class="btn sm">${ic('plus')} ถ่าย / เลือกรูป<input type="file" accept="image/*" hidden data-pf-file></label>${v ? `<button class="btn sm ghost" type="button" data-pf-clear>ลบรูป</button>` : ''}<span class="st" data-pf-st></span></div>
    <input type="hidden" name="${f.k}" id="${id}" value="${esc(v)}"></div></div>`;
  if (f.type === 'check') return `<div class="${cls}"><label class="check" for="${id}" style="color:var(--fg)"><input type="checkbox" id="${id}" name="${f.k}" ${v ? 'checked' : ''}> <span>${f.l}</span></label></div>`;
  if (f.type === 'area') return `<div class="${cls}"><label for="${id}">${f.l}</label><textarea class="in" id="${id}" name="${f.k}" rows="${f.rows || 1}">${esc(v)}</textarea></div>`;
  const type = f.type === 'number' ? 'text' : (f.type || 'text');
  const im = f.type === 'number' ? 'inputmode="decimal"' : f.type === 'tel' ? 'inputmode="tel"' : '';
  return `<div class="${cls}"><label for="${id}">${f.l}${req}</label><input class="in${f.type === 'number' || f.mono ? ' num' : ''}" id="${id}" name="${f.k}" type="${type}" ${im} value="${esc(v)}" ${f.req ? 'required' : ''} ${f.ro ? 'readonly' : ''} ${f.ph ? `placeholder="${esc(f.ph)}"` : ''} ${f.list ? `list="dl_${f.k}"` : ''} autocomplete="off">${f.list ? `<datalist id="dl_${f.k}">${f.list.map(o => `<option value="${esc(o)}">`).join('')}</datalist>` : ''}</div>`;
}
function wirePhotos(sh, fileName) {
  sh.querySelectorAll('[data-photo]').forEach(box => {
    const hidden = box.querySelector('input[type=hidden]'), file = box.querySelector('[data-pf-file]'), st = box.querySelector('[data-pf-st]');
    const submit = sh.querySelector('button[type=submit]');
    const show = v => { box.querySelector('.photo').outerHTML = photoBox(v, 200, '', 'data-pf-pick tabindex="-1"'); };
    box.addEventListener('click', e => {
      if (e.target.closest('[data-pf-pick]')) file.click();
      if (e.target.closest('[data-pf-clear]')) { hidden.value = ''; show(''); e.target.closest('[data-pf-clear]').remove(); }
    });
    file.addEventListener('change', async () => {
      const f = file.files[0]; if (!f) return;
      try {
        if (S.mode === 'live') {
          const big = await resizeImage(f, 1280); show(big);
          st.textContent = 'กำลังอัปโหลด…'; if (submit) submit.disabled = true;
          hidden.value = await uploadImage(big, fileName);
          st.textContent = 'อัปโหลดแล้ว';
        } else {
          const small = await resizeImage(f, 480, .78); show(small); hidden.value = small;
          st.textContent = S.mode === 'demo' ? 'เก็บในเครื่องนี้ (โหมดตัวอย่าง)' : 'เก็บในเครื่องนี้';
        }
      } catch (err) { st.textContent = 'อัปโหลดไม่สำเร็จ ลองใหม่'; toast('อัปโหลดรูปไม่สำเร็จ: ' + err.message); }
      if (submit) submit.disabled = false; file.value = '';
    });
  });
}
function readForm(form, fields) {
  const fd = new FormData(form), o = {};
  for (const f of fields) {
    if (f.type === 'check') o[f.k] = !!form.elements[f.k]?.checked;
    else if (f.type === 'number') { const s = String(fd.get(f.k) ?? '').trim(); o[f.k] = s === '' ? '' : num(s); }
    else o[f.k] = String(fd.get(f.k) ?? '').trim();
  }
  return o;
}
const delBtn = () => `<button class="btn danger" type="button" data-del>${ic('trash')}<span class="hide-phone">ลบ</span></button>`;
function armDelete(sh, fn) {
  const b = $('[data-del]', sh); if (!b) return;
  b.addEventListener('click', () => { if (b.classList.contains('arm')) { fn(); return; } b.classList.add('arm'); b.innerHTML = 'ยืนยันลบ'; setTimeout(() => { if (b.isConnected) { b.classList.remove('arm'); b.innerHTML = `${ic('trash')}<span class="hide-phone">ลบ</span>`; } }, 3500); });
}
function simpleForm({ title, sub, fields, row, isNew, sheet, onSave, deletable, beforeSave, extraTop = '' }) {
  const sh = openSheet(`${head(title, sub)}<form id="sf" style="display:contents"><div class="panel-b">${extraTop}<div class="fgrid">${fields.map(f => fieldHTML(f, row[f.k])).join('')}</div></div>
    <div class="panel-f"><div class="actions">${!isNew && deletable ? delBtn() : ''}<button class="btn pri grow" type="submit">บันทึก</button></div></div></form>`);
  const form = $('#sf', sh);
  wirePhotos(sh, row.item_code || row.lens_id || row.name || 'image');
  form.addEventListener('submit', e => {
    e.preventDefault();
    let o = Object.assign({}, row, readForm(form, fields));
    if (beforeSave) { const r = beforeSave(o, form); if (r === false) return; if (r) o = r; }
    closeSheet(sh);
    commit([up(sheet, o)], isNew ? 'เพิ่มแล้ว' : 'บันทึกแล้ว');
    onSave && onSave(o);
  });
  if (deletable) armDelete(sh, () => { closeSheet(sh); deletable(row); });
  return sh;
}

      ops = lines.map((l, i) => {
        const it = S.calc.item[l.item_code], q = num(l.qty), c = num(l.unit_cost), o = i === 0 ? oc : 0;
        return up('PURCHASES', { purchase_id: rid('P'), date, item_code: l.item_code, item_name: it.name, qty: q, unit_cost: c, other_cost: o, total: q * c + o, supplier: sup, note, created_at: created });

  });
}

  sh.addEventListener('click', e => {

    const b = e.target.closest('[data-q]'); if (!b) return;
    if (b.dataset.q === 'sale') formTxn('sale', { customer_id: id, channel: c.source });
    if (b.dataset.q === 'job') formJob({ customer_id: id });
    if (b.dataset.q === 'edit') { closeSheet(sh); formCustomer(Object.assign({}, c)); }

}
function lensFigure(l) {
  const rings = [['IRIS', num(l.iris_dia), num(l.iris_w)], ['ZOOM', num(l.zoom_dia), num(l.zoom_w)], ['FOCUS', num(l.focus_dia), num(l.focus_w)]].filter(r => r[1] > 0 || r[2] > 0);
  if (!rings.length) return '';
  const W = 340, H = 96, cy = 42, maxD = Math.max(...rings.map(r => r[1]), 50), k = 74 / maxD;
  const body = Math.min(...rings.filter(r => r[1]).map(r => r[1]), maxD) * k * .86, wk = 2.2;
  let x = 70, s = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="แผนภาพวงแหวนเลนส์">`;
  s += `<rect x="36" y="${cy - body * .42}" width="34" height="${body * .84}" fill="var(--surface-2)" stroke="var(--line)"/><text x="53" y="${H - 3}" text-anchor="middle">MOUNT</text>`;
  const tot = rings.reduce((a, r) => a + Math.max(8, r[2] || 8) * wk + 14, 0);
  s += `<rect x="70" y="${cy - body / 2}" width="${Math.max(tot + 24, 180)}" height="${body}" fill="var(--surface-2)" stroke="var(--line)"/>`;
  x += 12;
  for (const [n, d, w] of rings) {
    const h = (d || maxD * .9) * k, ww = Math.max(8, w || 8) * wk;
    s += `<rect x="${x}" y="${cy - h / 2}" width="${ww}" height="${h}" rx="3" fill="${n === 'FOCUS' ? 'var(--brand)' : n === 'ZOOM' ? 'var(--dust)' : 'var(--rose)'}"/>`;
    for (let g = x + 3; g < x + ww - 2; g += 3) s += `<line x1="${g}" x2="${g}" y1="${cy - h / 2 + 3}" y2="${cy + h / 2 - 3}" stroke="var(--on-tile)" stroke-opacity=".18"/>`;
    s += `<text x="${x + ww / 2}" y="${H - 3}" text-anchor="middle">${n}</text>`;
    x += ww + 14;
  }
  return s + '</svg>';
}
function openLens(id) {
  const l = S.calc.lens[id]; if (!l) return;
  const jobs = S.db.JOBS.filter(j => j.lens_id === id), fig = lensFigure(l);
  const kv = (lab, v) => `<div><span class="lbl">${lab}</span><b>${num(v) ? trimNum(v) : '—'}</b></div>`;
  const sh = openSheet(`${head(esc(lensTitle(l)), [l.lens_id, l.brand, l.series, l.mount].filter(Boolean).map(esc).join(' · '))}
    <div class="panel-b" style="overflow:hidden">
      <div class="trio"><div class="tile t-rose"><span class="lbl">Focal</span><div class="big" ${String(l.focal).length > 4 ? 'style="font-size:17px"' : ''}>${esc(l.focal || '—')}<small style="font-size:12px"> mm</small></div></div>
        <div class="tile t-card"><span class="lbl">Aperture</span><div class="big">f/${esc(l.aperture || '—')}</div></div>
        <div class="tile ${l.service_price ? 't-brand' : 't-card'}"><span class="lbl">ค่า MOD</span><div class="big">${l.service_price ? baht(num(l.service_price)) : '—'}</div></div></div>
      ${l.special_file ? `<div class="banner">ใช้ไฟล์พิเศษ (Special file) ตรวจไฟล์งานก่อนผลิต</div>` : ''}
      ${l.photo_url ? `<div class="lens-photo">${photoBox(l.photo_url, 800, '', 'data-q="photo"')}</div>` : ''}
      ${fig ? `<div class="lensfig">${fig}</div>` : ''}
      <div class="kv k4">${kv('Focus Ø', l.focus_dia)}${kv('Focus กว้าง', l.focus_w)}${kv('Zoom Ø', l.zoom_dia)}${kv('Zoom กว้าง', l.zoom_w)}${kv('Iris Ø', l.iris_dia)}${kv('Iris กว้าง', l.iris_w)}${kv('Move', l.move_len)}${kv('SIMMOD Ø', l.simmod_dia)}</div>
      ${l.note ? `<p style="margin:0;font-size:14px;flex:none"><span class="lbl">บันทึก </span>${esc(l.note)}</p>` : ''}
      <div class="actions"><button class="btn pri grow" type="button" data-q="job">${ic('wrench')} รับงานเลนส์นี้</button><button class="btn icon-only" type="button" data-q="edit" aria-label="แก้ไขเลนส์">${ic('edit')}</button></div>
      ${jobs.length ? `<div class="lbl" style="flex:none">งานที่เคยทำ (${jobs.length})</div><div class="list scroll">${jobs.map(jobRow).join('')}</div>` : ''}
      ${l.original_name && l.original_name !== l.name ? `<p class="muted" style="margin:0;font-size:12px;flex:none">ชื่อในระบบเดิม: ${esc(l.original_name)}</p>` : ''}
    </div>`);
  sh.addEventListener('click', e => {
    const b = e.target.closest('[data-q]'); if (!b) return;
    if (b.dataset.q === 'job') formJob({ lens_id: id, lens_name: lensTitle(l), price: l.service_price || '' });
    if (b.dataset.q === 'edit') { closeSheet(sh); formLens(Object.assign({}, l)); }
    if (b.dataset.q === 'photo') openViewer(l.photo_url, lensTitle(l));
  });
}
function openRecord() {
  const sh = openSheet(`${head('บันทึกรายการ')}
    <div class="panel-b"><div class="menu">

    ({ sale: () => formTxn('sale'), buy: () => formTxn('buy'), job: () => formJob(), cust: () => formCustomer(), item: () => formItem({}, true), adj: () => formAdjust(), lens: () => formLens(), scan: scanToItem })[b.dataset.r]();
  });

function openNavMenu() {
  const sh = openSheet(`${head('เมนู')}<div class="panel-b"><div class="list">${NAV.map(([k, t, i]) => `<a class="row" href="#${k}"><span class="ic bg-mute">${ic(i)}</span><span class="body"><span class="t">${TITLE[k]}</span>${k === 'setup' && needsAttention() ? `<span class="m">${S.mode === 'local' ? 'ยังไม่เชื่อมต่อ' : S.sync === 'offline' ? 'ออฟไลน์' : 'มีรายการรอส่ง'}</span>` : ''}</span>${ic('chev', 'width="16" height="16" style="flex:none"')}</a>`).join('')}</div></div>`);

/* ============ events ============ */
document.addEventListener('click', e => {
  const t = e.target;
  const go = t.closest('[data-go]'); if (go) { location.hash = '#' + go.dataset.go; return; }
  const act = t.closest('[data-act]');
  if (act) {
    const a = act.dataset.act;
    if (a === 'record') openRecord();
    else if (a === 'nav') openNavMenu();
    else if (a === 'lowstock') { e.preventDefault(); S.ui.stockCat = 'LOW'; S.ui.stockQ = ''; saveUI(); if (route() === 'stock') render(); else location.hash = '#stock'; }
    else if (a === 'scan-stock') scanToItem();
    else if (a === 'new-item') formItem({}, true);
    else if (a === 'new-customer') formCustomer();
    else if (a === 'new-lens') formLens();
    else if (a === 'new-job') formJob();
    else if (a === 'pull') pull();
    else if (a === 'print') window.print();
    else if (a === 'disconnect') { S.cfg.url = ''; S.cfg.key = ''; saveCfg(); location.reload(); }
    else if (a === 'reset-demo') { ls.del('cnmp.demo'); location.reload(); }
    else if (a === 'backup') {
      const u = URL.createObjectURL(new Blob([JSON.stringify(S.db, null, 1)], { type: 'application/json' })), x = document.createElement('a');
      x.href = u; x.download = `cnmp-backup-${todayISO()}.json`; document.body.appendChild(x); x.click(); x.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000);
    }
    return;
  }
  const it = t.closest('[data-item]'); if (it) { openItem(it.dataset.item); return; }
  const cu = t.closest('[data-cust]'); if (cu) { openCustomer(cu.dataset.cust); return; }
  const le = t.closest('[data-lens]'); if (le) { openLens(le.dataset.lens); return; }
  const op = t.closest('[data-open]');
  if (op) {
    const [sheet, id] = op.dataset.open.split(':');
    const row = (S.db[sheet] || []).find(r => String(r[ID[sheet]]) === id); if (!row) return;
    if (sheet === 'JOBS') formJob(Object.assign({}, row)); else formRow(sheet, Object.assign({}, row));
    return;
  }
  const c = t.closest('[data-cat]'); if (c) { S.ui.stockCat = c.dataset.cat; saveUI(); render(); return; }
  const b = t.closest('[data-brand]'); if (b) { S.ui.lensBrand = b.dataset.brand; saveUI(); render(); return; }
  const l = t.closest('[data-ledger]'); if (l) { S.ui.ledger = l.dataset.ledger; saveUI(); render(); return; }
  const j = t.closest('[data-jobst]'); if (j) { S.ui.jobSt = j.dataset.jobst; saveUI(); render(); return; }
  const h = t.closest('[data-hlist]'); if (h) { S.ui.homeList = h.dataset.hlist; saveUI(); render(); return; }
  const y = t.closest('[data-year]'); if (y && y.dataset.year) { S.ui.year = +y.dataset.year; render(); return; }
  const th = t.closest('[data-theme-set]'); if (th) { S.cfg.theme = th.dataset.themeSet; saveCfg(); applyTheme(); render(); return; }
  const dv = t.closest('[data-device-set]'); if (dv) { S.cfg.device = dv.dataset.deviceSet; saveCfg(); applyDevice(); render(); return; }
});
const SEARCH = { stockQ: 'stockQ', ledgerQ: 'ledgerQ', custQ: 'custQ', lensQ: 'lensQ' };
const onSearch = debounce(el => { S.ui[SEARCH[el.id]] = el.value; fillLists(); }, 90);
document.addEventListener('input', e => { if (SEARCH[e.target.id]) onSearch(e.target); });
document.addEventListener('submit', async e => {
  if (e.target.id !== 'cfgForm') return;
  e.preventDefault();
  const fd = new FormData(e.target);
  S.cfg.url = String(fd.get('url') || '').trim(); S.cfg.key = String(fd.get('key') || '').trim(); saveCfg();
  if (!S.cfg.url) { toast('ใส่ Web app URL ก่อน'); return; }
  S.mode = 'live'; S.queue = []; ls.set('cnmp.queue', []);
  await pull();
  render();
});

/* ============ boot: paint from local buffer first, sync after ============ */
(function boot() {
  applyTheme(); applyDevice();
  if (S.cfg.url) { S.mode = 'live'; S.db = normalize(ls.get('cnmp.cache', null) || emptyDB()); S.sync = S.queue.length ? 'pending' : 'ok'; }
  else if (window.CNMP_SEED) { S.mode = 'demo'; S.db = normalize(ls.get('cnmp.demo', null) || window.CNMP_SEED); }
  else { S.mode = 'local'; S.db = normalize(ls.get('cnmp.cache', null) || emptyDB()); }
  derive(); render();
  window.__bootMs = performance.now() - T0;
  // non-critical work after first paint
  setTimeout(() => {
    const f = document.createElement('link'); f.rel = 'stylesheet';
    f.href = 'https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600&display=swap';
    f.onload = () => { if (route() === 'home') drawChart(); };
    document.head.appendChild(f);
    if (S.mode === 'live') { flush(); if (Date.now() - S.lastPull > 15000) pull(true); }
    if ('serviceWorker' in navigator && document.documentElement.classList.contains('gh') && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
  }, 0);
  setInterval(() => { if (S.mode === 'live' && !stack.length && document.visibilityState === 'visible') pull(true); }, 5 * 60 * 1000);
})();
